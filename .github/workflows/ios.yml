# Build an unsigned IPA of FilmShooter on a hosted macOS runner.
#
# The IPA is uploaded as a workflow artifact and, on pushes to main, also
# attached to a rolling pre-release so it can be downloaded without logging in.
# Sign it yourself (AltStore, Sideloadly, TrollStore, ...) before installing.

name: iOS IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_MIN: '18.0'
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # From Xcode 26 the Metal compiler is a separate component.
      - name: Metal toolchain
        run: |
          xcrun -sdk iphoneos metal --version \
            || (xcodebuild -downloadComponent MetalToolchain && xcrun -sdk iphoneos metal --version)

      - name: XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: Engine kernels and resources
        run: bash scripts/build_engine_resources.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild \
            -project FilmShooter.xcodeproj \
            -scheme FilmShooter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/logs/xcodebuild.log | grep -E "error:|warning: .*(deprecated|unused variable)|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/logs/xcodebuild.log || {
            echo "::group::errors"; grep -E "error:" -A3 build/logs/xcodebuild.log | head -300; echo "::endgroup::"; exit 1; }

      - name: Package unsigned IPA
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/FilmShooter.app
          test -d "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../FilmShooter-unsigned.ipa Payload)
          ls -lh build/FilmShooter-unsigned.ipa
          du -sh "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: FilmShooter-unsigned-ipa
          path: build/FilmShooter-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/logs
          if-no-files-found: ignore

      - name: Publish rolling pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/FilmShooter-unsigned.ipa \
            --title "FilmShooter ${TAG} (unsigned)" \
            --notes "Unsigned IPA built from ${GITHUB_SHA}. Sign before installing." \
            --prerelease --target "$GITHUB_SHA"
